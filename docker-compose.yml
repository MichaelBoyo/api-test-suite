version: '3.8'
services:
  api:
    image: infralightio/test-integration-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/index.html"]
      interval: 5s
      timeout: 3s
      retries: 10
  tests:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080/api/v1
      TEST_USER1: test1
      TEST_PASS1: test123
      TEST_USER2: test2
      TEST_PASS2: test456
    volumes:
      - ./reports:/app/reports
    command: pytest --html=/app/reports/report.html --self-contained-html
